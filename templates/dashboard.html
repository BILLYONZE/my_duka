<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!--Bootstrap cdn  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <!-- Fontawesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Static style sheet -->
    <link rel="stylesheet" href="../static/css/style.css">
    <!-- bootstrap css link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="main">
        <!-- navbar -->
        <nav class="navbar navbar-expand-lg bg-warning p-1 mb-5 fixed-top opacity-100" data-bs-theme="dark">
            <div class="container-fluid ">
                <a class="navbar-brand fw-bold" href="/">
                    <h2>Myduka</h2>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                    <div class="navbar-nav">
                        <a class="nav-link" href="products">Products</a>
                        <a class="nav-link" href="sales">Sales</a>
                        <a class="nav-link" href="stock">Stock</a>
                        <a class="nav-link" href="login">Login</a>
                        <a class="nav-link" href="register">Register</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- page -->
        <div class="container-fluid mt-4 pt-5 ">
            <h1>My Dashboard</h1>
            <div class="row">
                <div class="col-6">
                    <canvas id="doughnut-chart" width="800" height="450"></canvas>
                </div>
                <div class="col-6">
                    <canvas id="bar-chart-horizontal" width="800" height="450"></canvas>
                </div>
                <div class="col-6">
                    <canvas id="bar-chart" width="800" height="450"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- charts js on dashboard -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>

    <script>

        // piechart for Profits of each product
        //         new Chart(document.getElementById("bar-chart"), {
        //             type: 'pie',
        //             data: {
        //                 labels: {{ product_name | safe}},
        //             datasets: [
        //             {
        //                 label: "TOTAL PRODUCTS STOCK",
        //                 backgroundColor: ["#3e95cd", "#8e5ea2", "#3cba9f", "#e8c3b9", "#c45850"],
        //                 data: {{ product_profit | safe}}
        //         }
        //         ]
        //     },
        //             options: {
        //             title: {
        //                 display: true,
        //                 text: 'Total Stock available'
        //             }
        //         }
        // });

        // Doughnut chart
        new Chart(document.getElementById("doughnut-chart"), {
            type: 'doughnut',
            data: {
                labels: {{ product_name | safe}},
            datasets: [
            {
                label: "Profits",
                backgroundColor: ["#3e95cd", "#8e5ea2", "#3cba9f", "#e8c3b9", "#c45850"],
                data: [2478, 5267, 734, 784, 433]
            }
        ]
            },
            options: {
            title: {
                display: true,
                text: 'Profits per product'
            }
        }
        });

        // Horizontalbar Graph
        new Chart(document.getElementById("bar-chart-horizontal"), {
            type: 'horizontalBar',
            data: {
                labels: {{ product_name | safe}},
            datasets: [
            {
                label: "Total Sales per Product",
                backgroundColor: ["#3e95cd", "#8e5ea2", "#3cba9f", "#e8c3b9", "#c45850"],
                data: {{ total_sale | safe}},
                    }
        ]
            },
            options: {
            legend: { display: false },
            title: {
                display: true,
                text: 'Total Sales Per Product'
            }
        }
        });

        // bar graph
        // Bar chart
        new Chart(document.getElementById("bar-chart"), {
            type: 'bar',
            data: {
                labels: {{product_name| safe}},
                datasets: [
                    {
                        label: "sales per day",
                        backgroundColor: ["#3e95cd", "#8e5ea2", "#3cba9f", "#e8c3b9", "#c45850"],
                        data: {{ sales_per_day | safe}}
                    }
                ]
            },
            options: {
                legend: { display: false },
                title: {
                    display: true,
                    text: 'sales per day'
                }
            }
        });

    </script>

</body>

</html>
