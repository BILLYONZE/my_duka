<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="main d-grid m-1">
        <nav class="navbar navbar-expand-lg bg-body-secondary p-3 fixed-top opacity-50" data-bs-theme="dark">
            <div class="container-fluid ">
                <a class="navbar-brand" href="#">Myduka</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end " id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                        <a class="nav-link" href="products">Products</a>
                        <a class="nav-link" href="sales">Sales</a>
                        <a class="nav-link" href="stock">Stock</a>
                        <a class="nav-link btn-outline-success" href=""><i class="fa-solid fa-cart-shopping fa-xl"
                                style="color: #a6a0a0;"></i></a>
                    </div>
                </div>
            </div>
        </nav>
        <div class="container text-center mt-5 py-5" id="home">
            <h1>Products</h1>

            <!-- Button trigger modal -->
            <button type="button" class=" text-center btn-outline-light btn-sm ms-3 w-25 " data-bs-toggle="modal"
                data-bs-target="#SubscribeModal">
                Add Products
            </button>
        </div>

            <table border="" class="table">
                <thead>
                    <tr>
                        <th>id</th>
                        <th>Product name</th>
                        <th>Buying price</th>
                        <th>Selling price</th>
                    </tr>
                </thead>
                <tbody>
                    {%for product in products%}
                    <tr>
                        <td>{{product[0]}}</td>
                        <td>{{product[1]}}</td>
                        <td>{{product[2]}}</td>
                        <td>{{product[3]}}</td>
                    </tr>
                    {%endfor%}
                </tbody>

            </table>
            
        <!-- Modal -->
        <div class="modal fade" id="SubscribeModal" tabindex="-1" aria-labelledby="SubscribeModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="SubscribeModalLabel">Add products</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="/add_products" method="post" class="form-control">
                            <label for="Name" class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="Name" name='product_name' required>
                            <label for="buying_p" class="form-label">Buying Price</label>
                            <input type="number" class="form-control" id="buying_p" name="buying_price" required>
                            <label for="selling_p" class="form-label">Selling Price</label>
                            <input type="number" class="form-control" id="selling_p" name="selling_price" required>
                            <button type="submit" class="btn btn-primary">Add Products</button>
                            <button type="submit" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
            crossorigin="anonymous"></script>

</body>

</html>
