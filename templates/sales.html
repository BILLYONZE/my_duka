{%extends "layout.html"%}
{%block content%}
<div class="main d-grid m-1">
    <div class="container text-center mt-5 py-5">
        <h1>Sales</h1>

        <!-- Button trigger modal -->
        <button type="button" class=" text-center btn-outline-light btn-sm ms-3 w-25 m-4" data-bs-toggle="modal"
            data-bs-target="#SubscribeModal">
            Add New Sales
        </button>
    </div>

    <table border="" class="table" id="salestable">
        <thead>
            <tr>
                <th>Sales_Id</th>
                <th>Product id</th>
                <th>Quantity</th>
                <th>created_at</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>
            {%for sale in sales%}
            <tr>
                <td>{{sale[0]}}</td>
                <td>{{ sale[1] }}</td>
                <td>{{sale[2]}}</td>
                <td>{{sale[3]}}</td>
                <td><!-- Button trigger modal for editing -->
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                        data-bs-target="#edit_sales{{sale[0]}}">
                        Edit
                    </button>

                    <div class="modal fade" id="edit_sales{{sale[0]}}" tabindex="-1"
                        aria-labelledby="edit_salesLabel{{sale[0]}}" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1 class="modal-title fs-5" id="SubscribeModalLabel">Add Sales made</h1>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <form action="/update_sales" method="post" class="form-control">
                                        <label for="pro_id" class="form-label">Product</label>
                                        <label for="pro_id" class="form-label">Product</label>
                                        <input type="text" class="form-control" id="pro_id_display"
                                            value="{% for product in products %}{% if product[0] == sale[1] %}{{ product[1] }}{% endif %}{% endfor %}"
                                            readonly>

                                        <!-- Hidden input to actually send the product id -->
                                        <input type="hidden" name="pro_id" value="{{ sale[1] }}">

                                        <label for="s.quantity" class="form-label"> Sales Quantity </label>
                                        <input type="number" class="form-control" id="salesquantity"
                                            name="salesquantity" value="{{sales[2]}}" required>
                                        <button type="submit" class="btn btn-primary m-2">Add Sales</button>
                                        <button type="submit" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Cancel</button>

                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            {%endfor%}
        </tbody>
    </table>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="//cdn.datatables.net/2.3.4/js/dataTables.min.js"></script>
</div>

<!-- Modal -->
<div class="modal fade" id="SubscribeModal" tabindex="-1" aria-labelledby="SubscribeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="SubscribeModalLabel">Add Sales made</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">

                <form action="/add_sales" method="post" class="form-control">
                    <label for="pid" class="form-label">Choose a Product</label>
                    <select name='pid' id='pid'>
                        {% for products in products %}
                        <option value="{{products[0]}}">{{products[1]}}</option>
                        {%endfor%}
                    </select><br>
                    <label for="s.quantity" class="form-label"> Sales Quantity </label>
                    <input type="number" class="form-control" id="s.quantity" name="s.quantity" required>
                    <label for="created_at" class="form-label">Created at?</label>
                    <input type="date" class="form-control" id="created_at" name="created_at" required>
                    <button type="submit" class="btn btn-primary m-2">Add Sales</button>
                    <button type="submit" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                </form>
            </div>
        </div>
    </div>
</div>
{%endblock%}
